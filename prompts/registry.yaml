# Prompt Registry

Central index of all agent prompts in the content pipeline. Prompts are **code**:
versioned with semver frontmatter, tracked in git (diff/blame/tags), and changed
via PR-style review. Every prompt file carries YAML frontmatter:

```yaml
---
name: <prompt-name>
version: <semver>          # major=breaking behavior, minor=additive, patch=fix
description: <one-line purpose>
updated: <YYYY-MM-DD>
status: active | deprecated
---
```

**Versioning workflow:**
1. Edit the prompt file → bump `version` in frontmatter.
2. Add an entry to `prompts/CHANGELOG.md` (what changed + why).
3. Commit: `feat(prompt)/fix(prompt): <description>`.
4. Tag releases: `git tag prompts-v1.0.0`.

