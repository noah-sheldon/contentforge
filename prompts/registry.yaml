# Prompt Registry — machine-readable index of every prompt in the pipeline.
#
# Prompts are code: versioned, tracked in git, changed via PR-style review.
# Loading by name: config.registry.prompts.PromptRegistry. Version pins in a
# tenant config (PromptRef) are honored.
#
# Entry shape:
#   name: <loadable name>          # what code/tenants reference
#   path: <repo-root-relative>     # yaml (prompt: key) or markdown (whole file)
#   version: <semver>              # canonical version for payload-only yaml
#   status: active | deprecated
#   description: one-line purpose
#
# For markdown entries the file's own frontmatter version is the source of
# truth and must match this index; loader fails fast on drift.
#
# Workflow:
# 1. Edit the prompt file -> bump `version` in this index (+ frontmatter for md).
# 2. Add a row to prompts/CHANGELOG.md (what changed + why).
# 3. Commit: feat(prompt)/fix(prompt): <description>.
# 4. Tag releases: git tag prompts-v1.0.0.

