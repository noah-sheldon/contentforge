<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{TITLE} — HyperFrames Composition</title>
  <!-- Google Fonts: Inter, Playfair Display, JetBrains Mono (Persona brand spec) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --obsidian: #12141C;
      --alabaster: #FAFAFA;
      --gold: #D4AF37;
      --gold-glow: rgba(212, 175, 55, 0.25);
      --silent-gray: #6B7280;
      --panel-bg: rgba(18, 20, 28, 0.85);
      --glass-border: rgba(212, 175, 55, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--obsidian);
      color: var(--alabaster);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 16:9 Canvas or 9:16 Canvas governed by data-aspect */
    .hyperframes-stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: var(--obsidian);
      overflow: hidden;
    }

    .hyperframes-stage[data-aspect="9:16"] {
      width: 1080px;
      height: 1920px;
    }

    /* Media Layers */
    .media-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .video-background {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Picture-in-Picture Floating Camera */
    .pip-cam-container {
      position: absolute;
      bottom: 48px;
      right: 48px;
      width: 380px;
      height: 240px;
      border-radius: 20px;
      border: 2px solid var(--gold);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 24px var(--gold-glow);
      overflow: hidden;
      z-index: 10;
      background: #000;
    }

    .hyperframes-stage[data-aspect="9:16"] .pip-cam-container {
      bottom: 120px;
      right: 48px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
    }

    .pip-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* HUD / Branding Overlay */
    .hud-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 64px;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      letter-spacing: 0.12em;
      color: var(--gold);
      background: var(--panel-bg);
      border: 1px solid var(--glass-border);
      padding: 8px 18px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      text-transform: uppercase;
    }

    .hud-topic {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--alabaster);
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
    }

    /* Kinetic Callouts & Subtitles */
    .callout-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 30;
      width: 80%;
      pointer-events: none;
    }

    .kinetic-title {
      font-family: 'Playfair Display', serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--alabaster);
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.9);
      margin-bottom: 16px;
    }

    .kinetic-title span.gold-highlight {
      color: var(--gold);
      text-shadow: 0 0 20px var(--gold-glow);
    }

    .kinetic-badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      color: var(--gold);
      background: var(--panel-bg);
      border: 2px solid var(--gold);
      padding: 12px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    }

    /* Progress Footer */
    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--silent-gray);
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--gold);
      box-shadow: 0 0 12px var(--gold);
    }
  </style>
</head>
<body>

  <div class="hyperframes-stage" data-aspect="{ASPECT_RATIO}" data-duration="{TOTAL_DURATION}">
    
    <!-- Background Screen Recording Track (Playwright capture or motion) -->
    <div class="media-layer" data-start="0" data-duration="{TOTAL_DURATION}">
      <video class="clip video-background" src="{CAPTURE_VIDEO_SRC}" muted autoplay playsinline></video>
    </div>

    <!-- Optional Voiceover Audio Track -->
    <audio class="clip" src="{VOICEOVER_AUDIO_SRC}" data-start="0" data-duration="{TOTAL_DURATION}"></audio>

    <!-- Optional PiP Webcam Overlay -->
    <div class="pip-cam-container" data-start="{PIP_START}" data-duration="{PIP_DURATION}">
      <video class="clip pip-video" src="{PIP_VIDEO_SRC}" muted autoplay playsinline></video>
    </div>

    <!-- HUD Overlay -->
    <div class="hud-layer">
      <div class="hud-header">
        <div class="hud-pill">// {LOCATION} • {SERIES} • {MODULE}</div>
        <div class="hud-topic">{TITLE}</div>
      </div>

      <div class="hud-footer">
        <span>NOAH SHELDON • APPLIED AI/ML</span>
        <span>{SERIES}</span>
      </div>
    </div>

    <!-- Kinetic Text & Callouts -->
    <div class="callout-overlay" id="callout-box">
      <h1 class="kinetic-title" id="kinetic-text">{HERO_TEXT}</h1>
      <div class="kinetic-badge" id="kinetic-subtext">{SUBTEXT}</div>
    </div>

    <!-- Progress Line -->
    <div class="progress-bar-container">
      <div class="progress-fill" id="progress-line"></div>
    </div>

  </div>

  <script>
    // HyperFrames Seek-Safe Deterministic Animation Controller
    const duration = parseFloat(document.querySelector('.hyperframes-stage').getAttribute('data-duration')) || 60;
    
    const masterTimeline = gsap.timeline({ paused: true });

    // Progress bar animation
    masterTimeline.to("#progress-line", { width: "100%", ease: "none", duration: duration }, 0);

    // Kinetic Text Animation sequence (Hook slam)
    masterTimeline.fromTo("#kinetic-text", 
      { opacity: 0, scale: 0.85, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.7)" },
      0.2
    );

    masterTimeline.fromTo("#kinetic-subtext",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      0.5
    );

    masterTimeline.to("#callout-box", {
      opacity: 0,
      y: -20,
      duration: 0.4,
      ease: "power2.in"
    }, 4.5);

    // HyperFrames Seek Hook
    window.seekHyperFrames = function(timeInSeconds) {
      masterTimeline.seek(timeInSeconds);
    };
  </script>
</body>
</html>
